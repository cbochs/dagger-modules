name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: k3s-dagger

    steps:
      - uses: actions/checkout@v4

      # _EXPERIMENTAL_DAGGER_RUNNER_HOST is injected into the runner pod by ARC,
      # pointing to the node-local Dagger engine socket. The action picks this up
      # automatically and skips spinning up its own engine.
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "v0.20.3"
          verb: "functions"
          workdir: "./remote-cache"
